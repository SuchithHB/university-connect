spring.application.name=university-connect

# --- Supabase PostgreSQL ---
spring.datasource.url=jdbc:postgresql://hostname.supabase.com:5432/postgres
spring.datasource.username=postgres.ref
spring.datasource.password=password

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false

# DEV ONLY. Prefer validate + Flyway migrations for production.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.jdbc.time_zone=UTC